name: Build and deploy to acc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: acc-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@v5
      # Tests are ran as a composite action instead of a separate workflow to avoid the overhead of starting new workflow.
      - name: Run tests
        uses: ./.github/actions/run-tests
      # Docker registry to store our images so its easier for other scripts to fetch later
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: Select commit image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if result=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ "$result" == *'not found'* || "$result" == *'manifest unknown'* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - name: Build and push image once
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Skip a stale main commit
        id: current
        if: github.event_name == 'push'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping deployment.'
          fi

  deploy:
    name: Deploy to acc
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.current == 'true'
    uses: ./.github/workflows/deploy-image.yml
    with:
      target: acc
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
