name: Rollback production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to restore (for example v1.0.0)
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: prod-deployment
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve previous release
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/resolve-release.sh rollback
      - name: Require a recorded release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName >/dev/null
      - name: Select existing image
        id: image
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Restore prod image
    needs: prepare
    uses: ./.github/workflows/deploy-vps.yml
    with:
      target: prod
      image: ${{ needs.prepare.outputs.image }}
    secrets: inherit
