name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [major, minor, patch]
        default: minor
      commit:
        description: Tested full commit SHA (blank uses this main run's commit)
        type: string
        required: false

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: prod-deployment
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve version and tested commit
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: bash .github/scripts/resolve-release.sh release
      # A hacky gh script that checks for successful ACC build on this hash (so theres smth to promote)
      - name: Require successful acc deployment
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'build-and-deploy-acc.yml', head_sha: process.env.RELEASE_SHA,
              event: 'push', status: 'success', per_page: 100
            });
            for (const run of runs) {
              // Exclude historical deploy.yml runs that targeted prod.
              if (run.name !== 'Build and deploy to acc') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, per_page: 100
              });
              if (jobs.some(job => job.conclusion === 'success' && job.steps?.some(
                step => step.name === 'Deploy to VPS' && step.conclusion === 'success'
              ))) {
                return;
              }
            }
            core.setFailed('This commit has no successful acc deployment. Deploy and test it in acc first.');
      - name: Select existing image
        id: image
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'Release uses the existing acc image; no rebuild.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to prod
    needs: prepare
    uses: ./.github/workflows/deploy-image.yml
    with:
      target_environment: prod
      image: ${{ needs.prepare.outputs.image }}
    secrets: inherit

  record:
    name: Record successful release
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Tag released commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "$RELEASE_TAG"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          echo "Released $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
