name: Run tests
description: Set up Java and Gradle, then run the tests

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: temurin

    - uses: gradle/actions/setup-gradle@v5

    - name: Run tests
      shell: bash
      run: bash ./gradlew test --console=plain
